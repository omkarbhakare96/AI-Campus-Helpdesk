{% extends "base.html" %}
{% block title %}Login — AI Campus Helpdesk{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="card">
    <h2>Log in</h2>
    <p class="text-muted mt-8" style="margin-bottom:20px;">Access your complaint dashboard.</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required maxlength="150" placeholder="you@campus.edu">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required maxlength="128" placeholder="Your password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Log in</button>
    </form>
    <p class="auth-switch">Don't have an account? <a href="/register">Register here</a></p>
    <p class="text-muted mt-16" style="font-size:0.8rem;">Demo admin: admin@campus.edu / Admin@123</p>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  btn.disabled = true;
  btn.textContent = "Logging in...";
  try {
    const data = await API.post("/api/auth/login", { email, password }, { auth: false });
    API.setToken(data.access_token);
    API.setUser(data.user);
    showToast("Welcome back, " + data.user.name + "!", "success");
    setTimeout(() => {
      window.location.href = data.user.role === "admin" ? "/admin" : "/dashboard";
    }, 300);
  } catch (err) {
    showToast(err.message, "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Log in";
  }
});
</script>
{% endblock %}
